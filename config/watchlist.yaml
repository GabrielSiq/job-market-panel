# The census universe: every company whose board is fetched daily.
#
# Companies that resolved to a Greenhouse board are collected from day one. Entries with
# `ats: unknown` are parked DELIBERATELY - they are picked up in Phase 2 when the Lever,
# Ashby and Workable adapters land. Do not delete them.
#
# Every token was verified against the board's self-reported `company_name`, which is the
# only available check that a guessed slug belongs to the company we meant. That check
# caught three wrong boards: 'carbon' (Carbon, Inc., not Carbon Health), 'wise' (an
# unrelated sales board) and 'remote' (General Assembly). A wrong token would have
# quietly attributed another company's hiring to this one for the life of the panel.
#
# Edit freely - this is config, not code. Adding a company takes effect on the next run.

